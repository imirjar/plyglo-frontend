version: '3.8'

services:
  site:
    image: ghcr.io/imirjar/plyglo-website:latest
    volumes:
      - plyglo-website:/app/dist

  app:
    image: ghcr.io/imirjar/plyglo-study:latest
    volumes:
      - plyglo-app:/app/build/web

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - plyglo-website:/usr/share/caddy/website:ro
      - plyglo-app:/usr/share/caddy/app:ro
    env_file:
      - .env
    depends_on:
      site:
        condition: service_completed_successfully
      app:
        condition: service_completed_successfully
    

volumes:
  plyglo-website:
  plyglo-app: